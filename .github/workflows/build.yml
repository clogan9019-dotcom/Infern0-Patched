name: Build Infern0 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          xcode-select --install || true
          brew install xcbeautify || true
      - name: Fix permissions
        run: chmod +x ./scripts/build.sh
      - name: Build IPA and capture logs
        run: |
          ./scripts/build.sh 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Infern0-IPA
          path: build/Infern0-*.ipa
